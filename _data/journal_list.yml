# Journal directory for the "Journals" section on /publication-planner/,
# grouped and filtered by research direction.
#
# pages  = length of a regular paper. "12–16 pp": 12 included, up to 16
#          with paid extra pages. "~" = soft/typical length; "no limit" =
#          none stated (typical length in parentheses where known).
# format = column format at submission: 2-col, 1-col, or magazine.
# note   = optional extra detail.
# Checked Oct 2026. "# unverified" = the official guide could not be read
# directly (figure from search snippets/mirrors); confirm before relying on it.

